apiVersion: v1
kind: Service
metadata:
  name: {{ include "deskflow.fullname" . }}-frontend
  labels:
    {{- include "deskflow.labels" . | nindent 4 }}
    {{- include "deskflow.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "deskflow.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
