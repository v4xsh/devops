{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
{{- $name := printf "%s-postgres" (include "deskflow.fullname" .) }}
{{- $password := .Values.postgres.password }}
{{- if not $password }}
{{- /* Reuse the password from a previous install so upgrades never rotate it under the database. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "deskflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
