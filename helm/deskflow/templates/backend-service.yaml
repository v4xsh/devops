apiVersion: v1
kind: Service
metadata:
  name: {{ include "deskflow.backendHost" . }}
  labels:
    {{- include "deskflow.labels" . | nindent 4 }}
    {{- include "deskflow.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "deskflow.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
