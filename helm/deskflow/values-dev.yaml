# Local / classroom cluster (kind, minikube, k3d).
# Images are built locally and side-loaded with `kind load docker-image`.

image:
  registry: ghcr.io/v4xsh
  tag: latest
  pullPolicy: IfNotPresent

config:
  environment: dev
  corsOrigins: "http://deskflow.local"

backend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

postgres:
  password: deskflow-dev
  storage: 1Gi

ingress:
  enabled: true
  className: nginx
  host: deskflow.local

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

serviceMonitor:
  enabled: true
  interval: 10s
